<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Translation Planning Assistant</title>
    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px
        }

        .container {
            max-width: 1200px;
            margin: auto
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1)
        }

        .hidden {
            display: none
        }

        .mode {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 14px 18px
        }

        .primary {
            background: #0078d4;
            color: #fff
        }

        .back {
            background: #666;
            color: #fff
        }

        .success {
            background: #107c10;
            color: #fff
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box
        }

        .result {
            background: #eef6ff;
            padding: 12px;
            border-left: 4px solid #0078d4;
            margin: 15px 0
        }
       
    </style>
</head>

<body>
    <div class='container'>
        <div id='home' class='card'>
            <h1>Translation Planning Assistant</h1>
            <div class='mode'><button class='primary' onclick="showPage('deliveryPage')">
                <span style="font-size:20px;font-weight:600;">When can we finish?</span>
                <br><br>
                <span style="font-size:12px;font-weight:normal;"
                >Estimate when your team is likely to finish based on the total number of words and your typical daily translation and approval pace.
                </span>
        </button>
        <button class="primary" onclick="showPage('targetPage')">
    <span style="font-size:20px;font-weight:600;">Can we hit this date?</span>
    <br><br>
                <span style="font-size:12px;font-weight:normal;">
                Calculate how many words your team needs to translate and approve each day to meet a target delivery date.
                </span>
</button>
        </div>
        </div>
        <div id='deliveryPage' class='card hidden'><button class='back' onclick='goHome()'>Back</button>
            <h2>When can we finish?</h2>
            <!-- Row 1 -->
<div class="grid" style="grid-template-columns: repeat(2, 1fr);">
    <div>
        <label>Start Date
        <span title="Select the date when translation work begins."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="startDate" type="date" required>
        
    </div>
    <div>
        <label>Words to be translated and approved
        <span title="Enter amount of words to translate and approve."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="wordCount"
        type="number"
        value="25000"
        min="1"
        step="1"
        required>
        
    </div>
</div>
<br>
<!-- Row 2 -->
<div class="grid" style="grid-template-columns: repeat(2, 1fr);">
    <div>
        <label>Number of translators working on the task
        <span title="Enter number of translators working on the task.&#10;&#10;You can enter decimals:&#10;1 = full-time&#10;0.5 = half-time"
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="translators" type="number" value="1" min="0.1" step="0.1">
        
    </div>
    <div>
        <label>Average words translated per translator per day
        <span title="Enter average translation throughput per translator.&#10;&#10;Default set to 2000 words per day.&#10;&#10;Adjust up/down as needed if you have more accurate productivity data."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
       <input id="wordsPerTranslator"
       type="number"
       value="2000"
       min="1"
       step="1"
       required>
        
    </div>
</div>
<br>
<!-- Row 3 -->
<div class="grid" style="grid-template-columns: repeat(2, 1fr);">
    <div>
        <label>Number of approvers working on the task
        <span title="Enter number of approvers working on the task.&#10;&#10;You can enter decimals:&#10;1 = full-time&#10;0.5 = half-time"
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="reviewers" 
        type="number" 
        value="1" 
        min="0.1" 
        step="0.1">
        
    </div>
    <div>
        <label>Average translated words approved per approver per day
        <span title="Enter average approval throughput per approver.&#10;&#10;Default set to 4000 words per day.&#10;&#10;Adjust up/down as needed if you have more accurate productivity data."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
       <input id="wordsPerReviewer"
        type="number"
        value="4000"
        min="1"
        step="1"
        required>
        
    </div>
</div>
<br>
<!-- Row 4 -->
<button class="success" onclick="calculateDelivery()">
    Calculate
</button>
<div id="deliveryResults"></div>
        </div>
        <div id='targetPage' class='card hidden'><button class='back' onclick='goHome()'>Back</button>
            <h2>Can we hit this date?</h2>
            <div>

    <div style="margin-bottom:20px;">
        <label>Start Date
         <span title="Select the date when translation work begins."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="targetStart" type="date" required>

    </div>

    <div style="margin-bottom:20px;">
        <label>Target Date
        <span title="Select the target date for when you want the task to be completed."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="targetDeadline" type="date" required>
        
    </div>

    <div style="margin-bottom:20px;">
        <label>Words to be Translated and Approved
        <span title="Enter amount of words to translate and approve."
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="targetWords" type="number" value="25000" min="1" step="1">
        
    </div>

    <div style="margin-bottom:20px;">
        <label>Number of Translators Working on the Task
        <span title="Enter number of translators working on the task.&#10;&#10;You can enter decimals:&#10;1 = full-time&#10;0.5 = half-time"
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="targetTranslators" type="number" value="1" min="0.1" step="0.1">
        
    </div>

    <div style="margin-bottom:20px;">
        <label>Number of approvers working on this task
         <span title="Enter number of approvers working on the task.&#10;&#10;You can enter decimals:&#10;1 = full-time&#10;0.5 = half-time"
        style="cursor:help;color:#0078d4;font-weight:bold;">❓</span>
        </label>
        <input id="targetReviewers" type="number" value="1" min="0.1" step="0.1">
        
    </div>

</div>

<button class='success' onclick='calculateTarget()'>
    Calculate
</button>


<div id='targetResults'></div>
</div>

<script>
function calculateDelivery() {
    const start = new Date(el('startDate').value);

    if (isNaN(start)) {
        alert("Please select a valid start date.");
        return;
    }

    const words = +el('wordCount').value;
    if (words <= 0) {
    alert("Enter a word count greater than 0. A value of 0 means there is no translation work to plan.");
    return;
    }
    const translators = +el('translators').value;
    const reviewers = +el('reviewers').value;
    const wordsPerTranslator = +el('wordsPerTranslator').value;
    const wordsPerReviewer = +el('wordsPerReviewer').value;
    if (translators <= 0) {
    alert("Number of translators must be greater than zero.");
    return;
    }

    if (reviewers <= 0) {
    alert("Number of approvers must be greater than zero.");
    return;
    }

    if (wordsPerTranslator < 1) {
    alert("Average words translated per translator per day must be at least 1.");
    return;
    }

    if (wordsPerReviewer < 1) {
    alert("Average translated words approved per approver per day must be at least 1.");
    return;
    }

    const translationDays =
        Math.ceil(words / (translators * wordsPerTranslator));

    const approvalDays =
        Math.ceil(words / (reviewers * wordsPerReviewer));

    const totalDays =
    Math.max(
        translationDays,
        approvalDays
    ) + 1;

    const completionDate =
        addWorkingDays(start, totalDays);

    el('deliveryResults').innerHTML = `
        <div class="result">
            <p><b>Translation Effort:</b> ${translationDays} working days</p>
            <p><b>Approval Effort:</b> ${approvalDays} working days</p>
            <p><b>Total Task Duration:</b> ${totalDays} working days</p>
            <p><b>Estimated Completion Date:</b> ${fmt(completionDate)}</p>
            <p><b>Planning assumptions:</b></p>
            <ul>
                <li>Approval begins one working day after translation starts, and the task is complete when all content has been translated and approved.</li>
                <li>No translation or approval work is performed on Saturdays or Sundays.</li>
                <li>Public holidays falling on weekdays are not excluded.</li>
            </ul>
        </div>
    `;
    }

    function el(id) { return document.getElementById(id) }
    function showPage(id) { 
        el('home').classList.add('hidden'); 
        el('deliveryPage').classList.add('hidden'); 
        el('targetPage').classList.add('hidden'); 
        el(id).classList.remove('hidden') } 
    function goHome() { el('home').classList.remove('hidden'); 
        el('deliveryPage').classList.add('hidden'); 
        el('targetPage').classList.add('hidden') } 
    function fmt(d) {
    return d.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}

function calculateTarget() {

    const s = new Date(el('targetStart').value);
    const d = new Date(el('targetDeadline').value);

    if (isNaN(s) || isNaN(d)) {
        alert("Please select valid dates.");
        return;
    }

    if (d < s) {
        alert("Deadline cannot be earlier than the start date.");
        return;
    }

    const words = +el('targetWords').value;

    if (words <= 0) {
    alert("Enter a word count greater than 0. A value of 0 means there is no translation work to plan.");
    return;
    }

    const t = +el('targetTranslators').value;
    const r = +el('targetReviewers').value;

    if (t <= 0 || r <= 0) {
        alert("Translator and approver counts must be greater than zero.");
        return;
    }

    const days = Math.max(1, workingDays(s, d));
    const perDay = Math.ceil(words / days);

    el('targetResults').innerHTML = `
        <div class='result'>
        <p><b>Time Available:</b> ${days} working days</p>
        
        <p><b>Daily Translation Goal:</b></p>
        <p>• Team total: ${perDay} words/day</p>
        <p>• Each translator: ${Math.ceil(perDay / t)} words/day</p>

        <p><b>Daily Approval Goal:</b></p>
        <p>• Team total: ${perDay} words/day</p>
        <p>• Each approver: ${Math.ceil(perDay / r)} words/day</p>
        </div>`;
    }

function workingDays(s, e) 
    { let n = 0, d = new Date(s); while (d <= e) 
    { let g = d.getDay(); if (g !== 0 && g !== 6) n++; d.setDate(d.getDate() + 1) } return n } 

const today = new Date();

function addWorkingDays(date, days) {
    let result = new Date(date);

    while (days > 0) {
        result.setDate(result.getDate() + 1);

        if (result.getDay() !== 0 && result.getDay() !== 6) {
            days--;
        }
    }

    return result;
}

const twoWeeksAhead = addWorkingDays(today, 10);

el('startDate').value = today.toISOString().split('T')[0];
el('targetStart').value = today.toISOString().split('T')[0];
el('targetDeadline').value = twoWeeksAhead.toISOString().split('T')[0];
</script>
</body>

</html>
